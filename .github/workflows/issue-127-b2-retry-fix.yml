name: Issue 127 B2 retry fix

on:
  push:
    paths:
      - ".github/workflows/issue-127-b2-retry-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/127-role-harness
          persist-credentials: true
      - name: Shorten generated test name and retrigger integration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue-127-b2-integration.yml')
          text = path.read_text()
          old = 'def test_confirmed_provider_timeout_records_retry_and_runner_does_not_loop(runtime_task):'
          new = 'def test_confirmed_timeout_records_retry_without_runner_loop(runtime_task):'
          if text.count(old) != 1:
              raise SystemExit('integration workflow anchor count != 1')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/issue-127-b2-retry-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: retry #127 adapter integration"
          git push origin HEAD:feat/127-role-harness
