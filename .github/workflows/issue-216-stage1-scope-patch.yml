name: Issue 216 Stage One Scope Patch

on:
  pull_request:
    paths:
      - ".github/workflows/issue-216-stage1-scope-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Apply stage-one scope patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: anchor count for replacement is {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          logical = "docs/data/logical-schema.md"
          replace_once(
              logical,
              "> 변경 기준일: 2026-09-15\n>\n> 관련 변경: Issue #41, #64, #69, #91, #110, #200, #203",
              "> 변경 기준일: 2026-09-16\n>\n> 관련 변경: Issue #41, #64, #69, #91, #110, #200, #203, #216",
          )
          replace_once(
              logical,
              "    PROMOTION_BATCH ||--o{ KNOWLEDGE_ITEM : creates\n",
              "    PROMOTION_BATCH ||--o{ KNOWLEDGE_ITEM : creates\n    PROMOTION_BATCH ||--o{ PROMOTION_CANONICAL_CHANGE : records\n",
