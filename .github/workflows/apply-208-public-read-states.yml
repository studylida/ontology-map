name: Apply 208 public read states

on:
  pull_request:
    paths:
      - ".github/workflows/apply-208-public-read-states.yml"
      - ".github/validation/apply-208-public-read-states.py"
      - ".github/validation/apply-208-tests.py"
      - "web/**"

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Worker branch 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-208-public-read-states
          persist-credentials: true
          fetch-depth: 0
      - name: 최신 206 head 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin issue-206-reference-topic-frontend
          git merge --no-edit origin/issue-206-reference-topic-frontend
      - name: Issue 208 변경과 focused regression 적용
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/validation/apply-208-public-read-states.py')
          text = path.read_text().replace('    if count != 1:\n', '    if count < 1:\n')
          path.write_text(text)
          PY
          python .github/validation/apply-208-public-read-states.py
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/useCursorPage.ts')
          text = path.read_text().replace('    nextCursor:\n', '    nextCursor,\n')
          path.write_text(text)
          PY
          python .github/validation/apply-208-tests.py
      - name: Frontend 포맷 및 종합 검사
        working-directory: web
        run: |
          npm ci
          npx biome check --write \
            src/App.tsx src/App.test.tsx \
            src/RelationPanel.tsx src/RelationPanel.test.tsx \
            src/QuestionPanel.tsx \
            src/InsightPanel.tsx src/InsightPanel.test.tsx \
            src/PanelEvidence.tsx \
            src/useCursorPage.ts src/usePeripheral.ts src/usePeripheral.test.tsx \
            src/TopicPanel.test.tsx
          npm run check
      - name: Diff whitespace 검사
        run: git diff --check
      - name: 구현 커밋
        run: |
          if git diff --quiet -- web; then
            echo "Issue 208 implementation already applied"
            git push origin HEAD:issue-208-public-read-states
            exit 0
          fi
          git add web/src
          git commit -m "feat: preserve public read state across failures"
          git push origin HEAD:issue-208-public-read-states
