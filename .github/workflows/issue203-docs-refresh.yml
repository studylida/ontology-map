name: Issue 203 Docs Refresh Temp

on:
  push:
    branches:
      - issue-203-topic-reference-lifecycle
    paths:
      - .github/workflows/issue203-docs-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-203-topic-reference-lifecycle
          fetch-depth: 2
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.7
          enable-cache: true
      - name: Refresh generated schema reference
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen python scripts/check_docs.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/schema-reference.md
          if git diff --cached --quiet; then
            echo "schema reference already current"
          else
            git commit -m "docs: refresh schema reference for #203"
            git push origin HEAD:issue-203-topic-reference-lifecycle
          fi
