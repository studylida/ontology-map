name: Issue 127 B2 patch

on:
  push:
    paths:
      - ".github/workflows/issue-127-b2-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/127-role-harness
          fetch-depth: 2
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Patch ambiguous timeout classification and verify
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runner = Path("server/src/ontology_map/extraction_runner.py")
          text = runner.read_text(encoding="utf-8")
          old = '''    if isinstance(error, (httpx.TimeoutException, APITimeoutError)):
              return ConfirmedProviderFailure("TIMEOUT", transient=True)
          '''
          new = '''    if isinstance(error, (httpx.TimeoutException, APITimeoutError)):
              # A local timeout can follow a partial write or a lost reply. Only a
              # provider HTTP 408/504 response is a confirmed timeout outcome.
              return None
          '''
          if text.count(old) != 1:
              raise SystemExit("runner timeout anchor count != 1")
          runner.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("server/tests/test_extraction_runner.py")
          text = tests.read_text(encoding="utf-8")
          old_known = '''        (httpx.ReadTimeout("private request"), "TIMEOUT"),
              (
                  APITimeoutError(request=httpx.Request("POST", "https://example.invalid")),
                  "TIMEOUT",
              ),
          '''
          if text.count(old_known) != 1:
              raise SystemExit("known timeout test anchor count != 1")
          text = text.replace(old_known, "", 1)
          ambiguous_anchor = '''        httpx.NetworkError("private ambiguous transport state"),
          '''
          ambiguous_timeouts = '''        httpx.ReadTimeout("private lost reply timeout"),
              APITimeoutError(request=httpx.Request("POST", "https://example.invalid")),
          '''
          if text.count(ambiguous_anchor) != 1:
              raise SystemExit("ambiguous test anchor count != 1")
          text = text.replace(
              ambiguous_anchor,
              ambiguous_timeouts + ambiguous_anchor,
              1,
          )
          tests.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/issue-127-b2-patch.yml
          uv sync --project server --frozen
          uv run --project server --frozen ruff format \
            server/src/ontology_map/extraction_provider.py \
            server/src/ontology_map/extraction_runner.py \
            server/tests/test_extraction_provider.py \
            server/tests/test_extraction_runner.py
          uv run --project server --frozen ruff check \
            server/src/ontology_map/extraction_provider.py \
            server/src/ontology_map/extraction_runner.py \
            server/tests/test_extraction_provider.py \
            server/tests/test_extraction_runner.py
          uv run --project server --frozen mypy server/src
          uv run --project server --frozen pytest -q \
            server/tests/test_extraction_provider.py \
            server/tests/test_extraction_runner.py
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: wire durable Model Studio generation preflight"
          git push origin HEAD:feat/127-role-harness
