name: Insight Fix

on:
  pull_request:
    paths:
      - ".github/workflows/insight-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/68-node-insight-generation
          fetch-depth: 2
          persist-credentials: true
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --project server --frozen
      - name: Apply exact fixes and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("server/src/ontology_map/insight_generation.py")
          text = service.read_text()
          text = text.replace(
              "        section_texts = (section.title, section.synthesis_text)\n",
              "        section_texts: tuple[str, ...] = (\n"
              "            section.title, section.synthesis_text\n"
              "        )\n",
          )
          service.write_text(text)

          db = Path("server/src/ontology_map/db/insight_generation.py")
          text = db.read_text()
          old = '''def _lock_publication(\n    session: Session,\n    prepared: PreparedInsightBundle,\n) -> None:\n    row = (\n        session.execute(\n            sa.text(\"\"\"\n                SELECT pan.node_search_document_id,\n                       pan.node_insight_model_task_id,\n                       pb.promotion_status, pb.publication_status\n                FROM publication_affected_node pan\n                JOIN promotion_batch pb\n                  ON pb.promotion_batch_id = pan.promotion_batch_id\n                WHERE pan.promotion_batch_id = :batch_id\n                  AND pan.node_id = :node_id\n                FOR UPDATE OF pan, pb\n            \"\"\"),\n            {\n                \"batch_id\": prepared.promotion_batch_id,\n                \"node_id\": prepared.agent_input.node_id,\n            },\n        )\n        .mappings()\n        .one_or_none()\n    )\n    if row is None:\n        raise InsightTaskError(\"publication row disappeared before finalization\")\n    if (\n        row[\"promotion_status\"] != \"COMMITTED\"\n        or row[\"publication_status\"] != \"PREPARING\"\n        or int(row[\"node_search_document_id\"] or 0)\n        != prepared.node_search_document_id\n        or row[\"node_insight_model_task_id\"]\n        != prepared.prior_insight_model_task_id\n    ):\n        raise InsightTaskError(\"publication selection changed before finalization\")\n'''
          new = '''def _lock_publication(\n    session: Session,\n    prepared: PreparedInsightBundle,\n) -> bool:\n    row = (\n        session.execute(\n            sa.text(\"\"\"\n                SELECT pan.node_search_document_id,\n                       pan.node_insight_model_task_id,\n                       pb.promotion_status, pb.publication_status\n                FROM publication_affected_node pan\n                JOIN promotion_batch pb\n                  ON pb.promotion_batch_id = pan.promotion_batch_id\n                WHERE pan.promotion_batch_id = :batch_id\n                  AND pan.node_id = :node_id\n                FOR UPDATE OF pan, pb\n            \"\"\"),\n            {\n                \"batch_id\": prepared.promotion_batch_id,\n                \"node_id\": prepared.agent_input.node_id,\n            },\n        )\n        .mappings()\n        .one_or_none()\n    )\n    if row is None:\n        return False\n    return bool(\n        row[\"promotion_status\"] == \"COMMITTED\"\n        and row[\"publication_status\"] == \"PREPARING\"\n        and int(row[\"node_search_document_id\"] or 0)\n        == prepared.node_search_document_id\n        and row[\"node_insight_model_task_id\"]\n        == prepared.prior_insight_model_task_id\n    )\n'''
          if old not in text:
              raise SystemExit("expected _lock_publication block not found")
          text = text.replace(old, new)
          text = text.replace(
              "    _task_for_update(session, model_task_id)\n"
              "    _lock_publication(session, prepared)\n"
              "    try:\n",
              "    _task_for_update(session, model_task_id)\n"
              "    if not _lock_publication(session, prepared):\n"
              "        _finish_task(session, model_task_id, \"VALIDATION_BLOCKED\", finished_at)\n"
              "        return InsightApplyResult(\n"
              "            status=\"VALIDATION_BLOCKED\",\n"
              "            report_ids=(None, None),\n"
              "            reason=\"STALE_PUBLICATION\",\n"
              "        )\n"
              "    try:\n",
          )
          db.write_text(text)

          pure_tests = Path("server/tests/test_insight_generation.py")
          pure = pure_tests.read_text()
          pure = pure.replace(
              "test_structured_output_is_strict_but_semantic_cardinality_is_product_validation",
              "test_structured_output_strictness_and_semantic_validation_boundary",
          )
          pure = pure.replace(
              "test_valid_bundle_allows_independent_window_questions_and_report_union_projection",
              "test_valid_bundle_allows_independent_windows_and_union_projection",
          )
          pure_tests.write_text(pure)

          tests = Path("server/tests/test_insight_generation_db.py")
          text = tests.read_text()
          text = text.replace(
              '                synthesis_text="다른 근거 조합에서는 두 번째 흐름을 확인할 수 있습니다.",\n',
              '                synthesis_text=(\n'
              '                    "다른 근거 조합에서는 두 번째 흐름을 "\n'
              '                    "확인할 수 있습니다."\n'
              '                ),\n',
          )
          text = text.replace(
              '        synthesis_text="주요 발견을 함께 보면 현재 자료가 보여주는 범위를 설명할 수 있습니다.",\n',
              '        synthesis_text=(\n'
              '            "주요 발견을 함께 보면 현재 자료가 보여주는 범위를 "\n'
              '            "설명할 수 있습니다."\n'
              '        ),\n',
          )
          text += '''\n\ndef test_changed_publication_pointer_blocks_bundle_without_overwrite() -> None:\n    _, ids = load_panel_fixture()\n    with rollback_session() as session:\n        now = datetime.now(UTC)\n        batch_id, _ = _preparing_publication(session, ids[\"gaon\"], now)\n        prepared = db.prepare_insight_bundle(\n            session,\n            promotion_batch_id=batch_id,\n            node_id=ids[\"gaon\"],\n            as_of_at=now,\n        )\n        task_id = _running_task(session, b\"stale-publication\", now)\n        changed_pointer = (\n            None if prepared.prior_insight_model_task_id is not None else task_id\n        )\n        session.execute(\n            s.publication_affected_node.update()\n            .where(\n                s.publication_affected_node.c.promotion_batch_id == batch_id,\n                s.publication_affected_node.c.node_id == ids[\"gaon\"],\n            )\n            .values(node_insight_model_task_id=changed_pointer)\n        )\n\n        result = db.apply_insight_bundle(\n            session,\n            model_task_id=task_id,\n            prepared=prepared,\n            proposal=_bundle(None, None),\n            finished_at=now + timedelta(seconds=1),\n        )\n        assert result.status == \"VALIDATION_BLOCKED\"\n        assert result.reason == \"STALE_PUBLICATION\"\n        assert result.report_ids == (None, None)\n        assert (\n            session.scalar(\n                sa.select(sa.func.count())\n                .select_from(s.node_insight_window)\n                .where(s.node_insight_window.c.model_task_id == task_id)\n            )\n            == 0\n        )\n        assert (\n            session.scalar(\n                sa.select(\n                    s.publication_affected_node.c.node_insight_model_task_id\n                ).where(\n                    s.publication_affected_node.c.promotion_batch_id == batch_id,\n                    s.publication_affected_node.c.node_id == ids[\"gaon\"],\n                )\n            )\n            == changed_pointer\n        )\n'''
          tests.write_text(text)
          PY
      - name: Format and lint fix
        run: |
          uv run --project server --frozen ruff format server
          uv run --project server --frozen ruff check --fix server
      - name: Verify type and lint
        run: |
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map
          uv run --project server --frozen ruff check server
          uv run --project server --frozen ruff format --check server
          uv run --project server --frozen pytest server/tests/test_insight_generation.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/insight-fix.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add server .github/workflows/insight-fix.yml
          git commit -m "fix: #68 stale publication·CI 경계 정리"
          git push origin HEAD:feat/68-node-insight-generation
