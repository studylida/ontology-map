name: Validate 208 final tree

on:
  pull_request:
    paths:
      - ".github/workflows/validate-208-final.yml"
      - "web/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  final-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-208-public-read-states
          fetch-depth: 0
      - name: Final diff whitespace check
        run: |
          git fetch origin issue-206-reference-topic-frontend
          git diff --check origin/issue-206-reference-topic-frontend...HEAD
      - name: Frontend official check
        working-directory: web
        run: |
          npm ci
          npm run check
      - name: Documentation contract check
        run: |
          uv run --project server --frozen python scripts/check_docs.py --check
