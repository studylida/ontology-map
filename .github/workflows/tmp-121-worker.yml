name: Temporary issue 121 worker

on:
  push:
    branches:
      - refactor/121-remove-pgvector
    paths:
      - .github/workflows/tmp-121-worker.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.7

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.7

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve PostgreSQL 18.6 image digest
        shell: bash
        run: |
          set -euo pipefail
          digest="sha256:$(docker buildx imagetools inspect postgres:18.6-bookworm --raw | sha256sum | awk '{print $1}')"
          echo "ONTOLOGY_MAP_POSTGRES_IMAGE=postgres:18.6-bookworm@${digest}" >> "$GITHUB_ENV"
          echo "Using postgres:18.6-bookworm@${digest}"

      - name: Apply approved issue 121 changes
        run: python scripts/tmp_121_worker.py

      - name: Refresh Python lock and generated schema reference
        shell: bash
        run: |
          set -euo pipefail
          uv lock --project server
          uv sync --project server --frozen
          uv run --project server ruff format \
            server/migrations/versions/0001_create_frozen_schema.py \
            server/src/ontology_map/db/schema.py \
            server/src/ontology_map/db/fixture.py \
            server/src/ontology_map/db/review_fixture.py \
            server/src/ontology_map/db/panel_fixture.py \
            server/tests/test_schema.py \
            server/tests/test_fixture.py
          uv run --project server --frozen python scripts/check_docs.py --write

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          cd server
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          cd ..
          uv run --project server --frozen python scripts/check_docs.py --check
          git diff --check
          if rg -n 'node_embedding|pgvector|EMBEDDING|Vector\(1024\)' \
            server/migrations/versions/0001_create_frozen_schema.py \
            server/src/ontology_map/db/schema.py \
            server/src/ontology_map/db/fixture.py \
            server/src/ontology_map/db/review_fixture.py \
            server/src/ontology_map/db/panel_fixture.py \
            server/pyproject.toml compose.yaml; then
            echo 'Removed embedding/pgvector contract remains in active runtime files.' >&2
            exit 1
          fi
          rg -n "to_tsvector\('simple'" server/src/ontology_map/db/schema.py server/migrations/versions/0001_create_frozen_schema.py

      - name: Prepare isolated database environment
        shell: bash
        run: |
          cat > .env.121 <<'EOF'
          POSTGRES_DB=ontology_map_121_test
          POSTGRES_USER=ontology_map
          POSTGRES_PASSWORD=ontology-map-121-test
          POSTGRES_PORT=55434
          ONTOLOGY_MAP_ENVIRONMENT=development
          ONTOLOGY_MAP_DATABASE_URL=postgresql+psycopg://ontology_map:ontology-map-121-test@127.0.0.1:55434/ontology_map_121_test
          EOF
          echo "COMPOSE_PROJECT_NAME=ontology-map-121-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Migration fixture backend and API validation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.121 up -d db
          for i in {1..60}; do
            if docker compose -p "$COMPOSE_PROJECT_NAME" --env-file .env.121 exec -T db pg_isready -U ontology_map -d ontology_map_121_test; then
              break
            fi
            sleep 2
          done
          cd server
          uv run --env-file ../.env.121 alembic upgrade head
          uv run --env-file ../.env.121 alembic current
          PYTHONPATH=src uv run --env-file ../.env.121 python -m ontology_map.db.fixture | tee /tmp/fixture-first.txt
          PYTHONPATH=src uv run --env-file ../.env.121 python -m ontology_map.db.fixture | tee /tmp/fixture-second.txt
          grep -q 'created=False' /tmp/fixture-second.txt || grep -q '이미 존재' /tmp/fixture-second.txt
          PYTHONPATH=src uv run --env-file ../.env.121 python -m ontology_map.db.review_fixture
          PYTHONPATH=src uv run --env-file ../.env.121 python -m ontology_map.db.panel_fixture
          uv run --env-file ../.env.121 pytest -q
          uv run --env-file ../.env.121 alembic check
          PYTHONPATH=src uv run --env-file ../.env.121 uvicorn ontology_map.main:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn-121.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:8000/api/v1/nodes/search?q=SK%ED%95%98%EC%9D%B4%EB%8B%89%EC%8A%A4&limit=5' >/tmp/search.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/search.json', encoding='utf-8'))
          assert payload['items'], payload
          assert 'match_reasons' in payload['items'][0], '#117 must remain out of #121'
          PY
          kill "$api_pid"
          trap - EXIT
          cd ..

      - name: Web regression validation
        working-directory: web
        run: |
          npm ci
          npm run check

      - name: Commit verified issue 121 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'studylida'
          git config user.email '100192485+studylida@users.noreply.github.com'
          git add compose.yaml server docs HANDOFF.md
          git status --short
          git commit -m 'refactor: pgvector와 node embedding 제거'
          git push origin HEAD:refactor/121-remove-pgvector

      - name: Cleanup isolated database
        if: always()
        shell: bash
        run: |
          if [ -f .env.121 ]; then
            docker compose -p "${COMPOSE_PROJECT_NAME:-ontology-map-121-${GITHUB_RUN_ID}}" --env-file .env.121 down --volumes --remove-orphans || true
          fi
