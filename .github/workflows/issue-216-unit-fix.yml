name: Issue 216 Unit Compatibility Fix

on:
  push:
    branches:
      - issue-216-promotion-provenance
    paths:
      - ".github/workflows/issue-216-unit-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-216-promotion-provenance
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Update unit expectations for batch-aware alias writer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server/tests/test_entity_resolution.py")
          text = path.read_text(encoding="utf-8")
          old = '''    alias.assert_called_once_with(session, 100, "한빛전자", "ko", 200, preferred=True)\n'''
          new = '''    alias.assert_called_once_with(\n        session, 7, 100, "한빛전자", "ko", 200, preferred=True\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit("alias mock expectation anchor not found exactly once")
          text = text.replace(old, new, 1)
          old = '''def test_alias_reuses_existing_identity_family_without_new_alias_row():\n    session = Mock()\n    session.execute.return_value.scalar_one_or_none.return_value = 90\n    db._ensure_alias(session, 10, "한빛전자", "ko", 200, preferred=False)\n    statements = [str(call.args[0]) for call in session.execute.call_args_list]\n    assert len(statements) == 2\n    assert "node_merge" in statements[0]\n    assert "INSERT INTO node_alias_evidence" in statements[1]\n    assert all("INSERT INTO node_alias (" not in sql for sql in statements)\n    session.commit.assert_not_called()\n'''
          new = '''def test_alias_reuses_existing_identity_family_without_new_alias_row(monkeypatch):\n    session = Mock()\n    session.execute.return_value.scalar_one_or_none.return_value = 90\n    evidence = Mock(return_value=True)\n    monkeypatch.setattr(db.provenance, "add_node_alias_evidence", evidence)\n\n    db._ensure_alias(session, 7, 10, "한빛전자", "ko", 200, preferred=False)\n\n    statements = [str(call.args[0]) for call in session.execute.call_args_list]\n    assert len(statements) == 1\n    assert "node_merge" in statements[0]\n    assert all("INSERT INTO node_alias (" not in sql for sql in statements)\n    evidence.assert_called_once_with(session, 7, 90, 200)\n    session.commit.assert_not_called()\n'''
          if text.count(old) != 1:
              raise SystemExit("existing alias unit anchor not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          uvx ruff@0.16.5 format server/tests/test_entity_resolution.py
          git rm .github/workflows/issue-216-unit-fix.yml
          git diff --check
      - name: Commit compatibility fix
        run: |
          git add server/tests/test_entity_resolution.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: update entity resolution alias writer expectations"
          git push origin HEAD:issue-216-promotion-provenance
