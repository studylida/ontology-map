name: Issue 213 Autofix

on:
  push:
    branches:
      - issue-213-relation-evidence-flow

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore: autoformat issue 213') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-213-relation-evidence-flow
          fetch-depth: 2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fix typed params and format
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/src/ontology_map/panel.py')
          text = path.read_text()
          old = '    after_id, as_of_at = _position(cursor, "panel-claims", scope, datetime.now(UTC))\n    params = {'
          new = '    after_id, as_of_at = _position(cursor, "panel-claims", scope, datetime.now(UTC))\n    params: dict[str, Any] = {'
          if old not in text:
              raise SystemExit('target panel params block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          uv sync --project server --frozen
          uv run --project server --frozen ruff format server
          cd web
          npm ci
          npx biome check --write .
      - name: Commit formatting
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/ontology_map web/src
          git commit -m "chore: autoformat issue 213"
          git push origin HEAD:issue-213-relation-evidence-flow
