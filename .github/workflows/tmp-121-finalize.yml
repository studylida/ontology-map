name: Temporary issue 121 finalize

on:
  push:
    branches:
      - refactor/121-remove-pgvector
    paths:
      - .github/workflows/tmp-121-finalize.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.7
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.7
      - name: Confirm branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refactor/121-remove-pgvector
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/refactor/121-remove-pgvector)"
      - name: Apply final documentation corrections
        run: python scripts/tmp_121_doc_fix.py
      - name: Verify documentation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project server --frozen
          uv run --project server --frozen python scripts/check_docs.py --check
          git diff --check
          ! grep -F -n '`EMBEDDING`만 비움' docs/data/logical-schema.md
          ! grep -F -n 'schema가 없는 `EMBEDDING`' docs/data/logical-schema.md
          ! grep -E -n 'HNSW|IVFFlat|cosine exact search' docs/data/physical-schema.md
          grep -F -n '#117' docs/product/design.md docs/development/implementation-stack.md HANDOFF.md
      - name: Commit documentation correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hye'
          git config user.email '100192485+studylida@users.noreply.github.com'
          git add docs/data/logical-schema.md docs/data/physical-schema.md
          git commit -m 'docs: pgvector 제거 계약 잔존 정리'
          git fetch origin refactor/121-remove-pgvector
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/refactor/121-remove-pgvector)"
          git push origin HEAD:refactor/121-remove-pgvector
