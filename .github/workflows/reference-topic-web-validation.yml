name: Reference Topic web validation

on:
  pull_request:
    paths:
      - ".github/workflows/reference-topic-web-validation.yml"
      - "web/**"

permissions:
  contents: read

jobs:
  web:
    name: web format · lint · typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node 환경 확인
        run: node --version && npm --version
      - name: Web 의존성 설치
        working-directory: web
        run: npm ci
      - name: Web 전체 검사
        working-directory: web
        run: npm run check
