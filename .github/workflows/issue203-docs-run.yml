name: Issue 203 docs run

on:
  push:
    branches:
      - issue-203-topic-reference-lifecycle
    paths:
      - ".github/workflows/issue203-docs-run.yml"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-203-topic-reference-lifecycle
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Update docs
        run: |
          python scripts/issue203_docs_temp.py
          uv sync --project server --frozen
          uv run --project server --frozen python scripts/check_docs.py --write
          uv run --project server --frozen python scripts/check_docs.py --check
          git diff --check
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: document Topic reference lifecycle contract"
          git push origin HEAD:issue-203-topic-reference-lifecycle
