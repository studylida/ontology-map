name: Followup Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/followup-diagnostics.yml"
      - "server/**"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --project server --frozen
      - name: Capture diagnostics
        run: |
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map > /tmp/mypy.txt 2>&1 || true
          uv run --project server --frozen ruff check server > /tmp/ruff.txt 2>&1 || true
          uv run --project server --frozen ruff format --check server > /tmp/format.txt 2>&1 || true
      - name: mypy contracts file clean
        if: ${{ always() }}
        run: '! grep -q "followup_generation_contracts.py:" /tmp/mypy.txt'
      - name: mypy service file clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/followup_generation.py:" /tmp/mypy.txt'
      - name: mypy db file clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/db/followup_generation.py:" /tmp/mypy.txt'
      - name: mypy db lines 1-199 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:([1-9][0-9]?|1[0-9]{2}):" /tmp/mypy.txt'
      - name: mypy db lines 200-399 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:([23][0-9]{2}):" /tmp/mypy.txt'
      - name: mypy db lines 400-599 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:([45][0-9]{2}):" /tmp/mypy.txt'
      - name: mypy arg-type clean
        if: ${{ always() }}
        run: '! grep -q "\[arg-type\]" /tmp/mypy.txt'
      - name: mypy assignment clean
        if: ${{ always() }}
        run: '! grep -q "\[assignment\]" /tmp/mypy.txt'
      - name: mypy return-value clean
        if: ${{ always() }}
        run: '! grep -q "\[return-value\]" /tmp/mypy.txt'
      - name: mypy no-any-return clean
        if: ${{ always() }}
        run: '! grep -q "\[no-any-return\]" /tmp/mypy.txt'
      - name: mypy valid-type clean
        if: ${{ always() }}
        run: '! grep -q "\[valid-type\]" /tmp/mypy.txt'
      - name: mypy misc clean
        if: ${{ always() }}
        run: '! grep -q "\[misc\]" /tmp/mypy.txt'
      - name: mypy operator clean
        if: ${{ always() }}
        run: '! grep -q "\[operator\]" /tmp/mypy.txt'
      - name: Ruff contracts clean
        if: ${{ always() }}
        run: '! grep -q "followup_generation_contracts.py" /tmp/ruff.txt'
      - name: Ruff service clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/followup_generation.py" /tmp/ruff.txt'
      - name: Ruff db clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/db/followup_generation.py" /tmp/ruff.txt'
      - name: Ruff tests clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup" /tmp/ruff.txt'
      - name: Ruff C901 clean
        if: ${{ always() }}
        run: '! grep -q "C901" /tmp/ruff.txt'
      - name: Ruff I001 clean
        if: ${{ always() }}
        run: '! grep -q "I001" /tmp/ruff.txt'
      - name: Format contracts clean
        if: ${{ always() }}
        run: '! grep -q "followup_generation_contracts.py" /tmp/format.txt'
      - name: Format service clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/followup_generation.py" /tmp/format.txt'
      - name: Format db clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/db/followup_generation.py" /tmp/format.txt'
      - name: Format tests clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup" /tmp/format.txt'
