name: Followup Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/followup-diagnostics.yml"
      - "server/**"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --project server --frozen
      - name: Capture diagnostics
        run: |
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map > /tmp/mypy.txt 2>&1 || true
          uv run --project server --frozen ruff check server > /tmp/ruff.txt 2>&1 || true
          uv run --project server --frozen ruff format --check server > /tmp/format.txt 2>&1 || true
      - name: db 200-249 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:2[0-4][0-9]:" /tmp/mypy.txt'
      - name: db 250-299 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:2[5-9][0-9]:" /tmp/mypy.txt'
      - name: db 300-349 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:3[0-4][0-9]:" /tmp/mypy.txt'
      - name: db 350-399 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:3[5-9][0-9]:" /tmp/mypy.txt'
      - name: db 400-449 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:4[0-4][0-9]:" /tmp/mypy.txt'
      - name: db 450-499 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:4[5-9][0-9]:" /tmp/mypy.txt'
      - name: db 500-549 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:5[0-4][0-9]:" /tmp/mypy.txt'
      - name: db 550-599 clean
        if: ${{ always() }}
        run: '! grep -Eq "db/followup_generation.py:5[5-9][0-9]:" /tmp/mypy.txt'
      - name: assignment str expression absent
        if: ${{ always() }}
        run: '! grep -Eq "Incompatible types in assignment .*expression has type .str" /tmp/mypy.txt'
      - name: assignment none expression absent
        if: ${{ always() }}
        run: '! grep -Eq "Incompatible types in assignment .*expression has type .None" /tmp/mypy.txt'
      - name: assignment row expression absent
        if: ${{ always() }}
        run: '! grep -Eq "Incompatible types in assignment .*Row" /tmp/mypy.txt'
      - name: assignment PreparedFollowup absent
        if: ${{ always() }}
        run: '! grep -q "PreparedFollowup" /tmp/mypy.txt'
      - name: assignment PeriodRole absent
        if: ${{ always() }}
        run: '! grep -q "PeriodRole" /tmp/mypy.txt'
      - name: Ruff db clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/db/followup_generation.py" /tmp/ruff.txt'
      - name: Ruff generation test clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup_generation.py" /tmp/ruff.txt'
      - name: Ruff DB test clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup_generation_db.py" /tmp/ruff.txt'
      - name: Ruff read test clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup_read_contract.py" /tmp/ruff.txt'
      - name: Format db clean
        if: ${{ always() }}
        run: '! grep -q "src/ontology_map/db/followup_generation.py" /tmp/format.txt'
      - name: Format generation test clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup_generation.py" /tmp/format.txt'
      - name: Format DB test clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup_generation_db.py" /tmp/format.txt'
      - name: Format read test clean
        if: ${{ always() }}
        run: '! grep -q "tests/test_followup_read_contract.py" /tmp/format.txt'
