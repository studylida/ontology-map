name: Followup Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/followup-diagnostics.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/129-followup-generation
          fetch-depth: 2
          persist-credentials: true
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --project server --frozen
      - name: Apply exact type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/src/ontology_map/db/followup_generation.py")
          text = path.read_text()
          text = text.replace(
              "        row = claim_rows.get(claim_id)\n"
              "        excerpts = evidence.get(claim_id, [])\n"
              "        if row is None or not excerpts:\n",
              "        claim_row = claim_rows.get(claim_id)\n"
              "        excerpts = evidence.get(claim_id, [])\n"
              "        if claim_row is None or not excerpts:\n",
          )
          text = text.replace(
              '                statement_text=str(row["statement_text"]),\n'
              '                modality=row["modality"],\n',
              '                statement_text=str(claim_row["statement_text"]),\n'
              '                modality=claim_row["modality"],\n',
          )
          text = text.replace(
              "    result = session.execute(\n"
              "        s.model_task.update()\n",
              "    updated_task_id = session.scalar(\n"
              "        s.model_task.update()\n",
              1,
          )
          text = text.replace(
              "            finished_at=finished_at,\n"
              "        )\n"
              "    )\n"
              "    if result.rowcount != 1:\n",
              "            finished_at=finished_at,\n"
              "        )\n"
              "        .returning(s.model_task.c.model_task_id)\n"
              "    )\n"
              "    if updated_task_id is None:\n",
              1,
          )
          path.write_text(text)
          PY
      - name: Ruff format and import fix
        run: |
          uv run --project server --frozen ruff format server
          uv run --project server --frozen ruff check --fix server
      - name: Verify type and lint
        run: |
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map
          uv run --project server --frozen ruff check server
          uv run --project server --frozen ruff format --check server
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/followup-diagnostics.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add server .github/workflows/followup-diagnostics.yml
          git commit -m "fix: #129 CI 타입·포맷 정리"
          git push origin HEAD:feat/129-followup-generation
