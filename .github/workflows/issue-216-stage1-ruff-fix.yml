name: Issue 216 Stage One Ruff Fix

on:
  push:
    branches:
      - issue-216-promotion-provenance
    paths:
      - ".github/workflows/issue-216-stage1-ruff-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-216-promotion-provenance
          persist-credentials: true
      - name: Apply lint fix
        run: python scripts/issue216_wrap_fk_assertions.py
      - name: Commit fix
        run: |
          git rm \
            .github/workflows/issue-216-stage1-ruff-fix.yml \
            scripts/issue216_wrap_fk_assertions.py
          git diff --check
          git add server/tests/test_promotion_provenance_postgres.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: wrap promotion provenance FK assertions"
          git push origin HEAD:issue-216-promotion-provenance
