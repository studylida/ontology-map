name: Documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 문서 계약 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
      - name: uv 준비
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.7"
          enable-cache: true
      - name: 생성 문서·링크·ADR 검사
        run: uv run --project server --frozen python scripts/check_docs.py --check
