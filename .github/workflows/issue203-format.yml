name: Issue 203 format

on:
  push:
    branches:
      - issue-203-topic-reference-lifecycle
    paths:
      - ".github/workflows/issue203-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-203-topic-reference-lifecycle
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Format #203 Python changes
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen ruff format server
          uv run --project server --frozen ruff check server
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add server
          git commit -m "style: format #203 implementation"
          git push origin HEAD:issue-203-topic-reference-lifecycle
