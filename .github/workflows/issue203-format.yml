name: Issue 203 format

on:
  push:
    branches:
      - issue-203-topic-reference-lifecycle
    paths:
      - ".github/workflows/issue203-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-203-topic-reference-lifecycle
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Format #203 Python changes
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen ruff format server
          python - <<'PY'
          from pathlib import Path

          init_path = Path("server/src/ontology_map/db/__init__.py")
          init_text = init_path.read_text()
          init_text = init_text.replace(
              "from ontology_map.db import topic_reference_schema as _topic_reference_schema\n",
              "from ontology_map.db import topic_reference_schema as topic_reference_schema\n",
          )
          init_path.write_text(init_text)

          test_path = Path("server/tests/test_topic_reference_migration_postgres.py")
          test_text = test_path.read_text()
          test_text = test_text.replace(
              '"INSERT INTO node (node_id, node_type_id) VALUES (:node_id, :type_id)"',
              '"INSERT INTO node (node_id, node_type_id) "\n'
              '                    "VALUES (:node_id, :type_id)"',
          )
          test_text = test_text.replace(
              '"SELECT current_state FROM knowledge_item WHERE knowledge_item_id=:id"',
              '"SELECT current_state FROM knowledge_item "\n'
              '                        "WHERE knowledge_item_id=:id"',
          )
          test_path.write_text(test_text)
          PY
          uv run --project server --frozen ruff format server
          uv run --project server --frozen ruff check server
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add server
          git commit -m "style: format #203 implementation"
          git push origin HEAD:issue-203-topic-reference-lifecycle
