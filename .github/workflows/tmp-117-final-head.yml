name: Temporary 117 final head

on:
  push:
    branches:
      - verify/117-final-head

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact target and diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fa3da5e4e26e67c564f2b26fae1d55d114c8298f"
          git fetch origin main
          git diff --check origin/main...HEAD^
          test -z "$(git diff --name-only origin/main...HEAD^ | grep -E 'entity_resolution|entity-resolution|server/migrations|db/schema.py' || true)"
          ! grep -R "match_reasons\|SearchMatchReason" server/src/ontology_map web/src --include='*.py' --include='*.ts' --include='*.tsx'
          ! grep -q "node_context" server/src/ontology_map/db/search.py

      - name: Web full check
        working-directory: web
        run: |
          npm ci
          npm run check
