name: Validate 208 browser paths

on:
  pull_request:
    paths:
      - ".github/workflows/validate-208-browser.yml"
      - ".github/validation/browser-208.spec.ts"
      - "web/**"

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact worker head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-208-public-read-states
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Install isolated browser runner
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y
          npm install @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/.github/validation/browser-208.spec.ts" browser-208.spec.ts
      - name: Start Vite with no configured center
        working-directory: web
        run: |
          VITE_DEFAULT_CENTER_NODE_ID= npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ontology-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ontology-web.log
          exit 1
      - name: Run focused real-browser validation
        working-directory: /tmp/pw
        run: npx playwright test browser-208.spec.ts --reporter=line
