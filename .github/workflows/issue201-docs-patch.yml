name: Issue 201 Docs Patch Temp

on:
  push:
    branches:
      - issue-201-approved-ontology-reference-data
    paths:
      - ".github/workflows/issue201-docs-patch.yml"
      - "scripts/issue201_docs_patch_temp.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-201-approved-ontology-reference-data
          fetch-depth: 2
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Apply and verify docs
        run: |
          python scripts/issue201_docs_patch_temp.py
          uv sync --project server --frozen
          uv run --project server --frozen python scripts/check_docs.py --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/logical-schema.md docs/data/ontology-reference-data.md docs/operations/database.md docs/product/design.md
          git commit -m "docs: document approved ontology reference activation"
          git push origin HEAD:issue-201-approved-ontology-reference-data
