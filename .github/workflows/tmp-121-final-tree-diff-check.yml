name: Temporary #121 final tree diff check

on:
  push:
    branches:
      - verify/121-final-tree-diff-check

permissions:
  contents: read

jobs:
  diff-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify target and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4ac88735c2cb8a5a4e9599dd1ea777a2f85f790a"
          git fetch origin main
          git diff --check origin/main...HEAD^
