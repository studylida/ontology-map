name: Issue 127 B3 provenance wiring

on:
  push:
    branches:
      - feat/127-role-harness
    paths:
      - .github/workflows/issue-127-b3-provenance.yml
      - scripts/issue_127_b3_wire_provenance.py

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ke127-b3-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: ontology_map_ke127_test
      POSTGRES_USER: ke127_test
      POSTGRES_PORT: "127.0.0.1:55433"
      ONTOLOGY_MAP_ENVIRONMENT: development
      PYTHONPATH: ${{ github.workspace }}/server/src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Disambiguate staging patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/issue_127_b3_wire_provenance.py")
          text = path.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    if text.count(old) != 1:\n        raise RuntimeError(f"{label}: expected one anchor, got {text.count(old)}")\n    return text.replace(old, new, 1)'''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:\n    count = text.count(old)\n    if label == "noop provenance count before":\n        if count < 1:\n            raise RuntimeError(f"{label}: missing anchor")\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected one anchor, got {count}")\n    return text.replace(old, new, 1)'''
          if old not in text:
              raise SystemExit("replace_once anchor changed")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply official #216 wiring
        run: python scripts/issue_127_b3_wire_provenance.py
      - name: Apply final B3 contract followups
        run: |
          python - <<'PY'
          from pathlib import Path

          promotion = Path("server/src/ontology_map/extraction_promotion.py")
          text = promotion.read_text()
          old = '''    existing = promotion_db.event_extent(session, event.event_node_id)\n    if existing is not None and existing != expected:\n        raise ValueError("EVENT_TEMPORAL_EXTENT_CONFLICT")'''
          new = '''    existing = promotion_db.event_extent(session, event.event_node_id)\n    if existing is None and not event.node_is_new:\n        raise ValueError("EXISTING_EVENT_EXTENT_PROVENANCE_UNSUPPORTED")\n    if existing is not None and existing != expected:\n        raise ValueError("EVENT_TEMPORAL_EXTENT_CONFLICT")'''
          if text.count(old) != 1:
              raise SystemExit("event extent boundary anchor changed")
          promotion.write_text(text.replace(old, new, 1))

          test = Path("server/tests/test_extraction_promotion_postgres.py")
          text = test.read_text()
          old = "from datetime import UTC, datetime, timedelta\n"
          if old not in text:
              raise SystemExit("datetime import anchor changed")
          text = text.replace(old, old + "from decimal import Decimal\n", 1)
          replacements = {
              '"value": {"kind": "NUMBER", "value": "100", "unit": "GB_PER_S"}':
                  '"value": {"kind": "NUMBER", "value": Decimal("100"), "unit": "GB_PER_S"}',
              '"start": {"value": "2026-09-01T00:00:00Z", "precision": "DAY"}':
                  '"start": {"value": datetime(2026, 9, 1, tzinfo=UTC), "precision": "DAY"}',
              '"start": {"value": "2026-09-02T00:00:00Z", "precision": "DAY"}':
                  '"start": {"value": datetime(2026, 9, 2, tzinfo=UTC), "precision": "DAY"}',
          }
          for before, after in replacements.items():
              if before not in text:
                  raise SystemExit(f"strict fixture anchor missing: {before}")
              text = text.replace(before, after)

          anchor = '''def test_conflict_rolls_back_nodes_relation_claim_and_batch() -> None:\n'''
          regression = '''def test_existing_event_without_extent_fails_closed_and_rolls_back_provenance(\n    b3_case: B3Case,\n) -> None:\n    case = b3_case\n    with Session(case.engine) as session, session.begin():\n        policy = session.scalar(\n            sa.select(schema.lint_policy_version.c.lint_policy_version_id).where(\n                schema.lint_policy_version.c.is_active\n            )\n        )\n        batch_id = int(\n            session.execute(\n                sa.insert(schema.promotion_batch)\n                .values(\n                    lint_policy_version_id=int(policy),\n                    promotion_status="COMMITTED",\n                    committed_at=datetime.now(UTC),\n                )\n                .returning(schema.promotion_batch.c.promotion_batch_id)\n            ).scalar_one()\n        )\n        event_type = int(\n            session.scalar(\n                sa.select(schema.node_type.c.node_type_id).where(\n                    schema.node_type.c.node_type_code == "EVENT"\n                )\n            )\n        )\n        event_node_id = int(\n            session.execute(\n                sa.insert(schema.knowledge_item)\n                .values(\n                    item_kind="NODE",\n                    current_state="EVIDENCE_VERIFIED",\n                    promotion_batch_id=batch_id,\n                )\n                .returning(schema.knowledge_item.c.knowledge_item_id)\n            ).scalar_one()\n        )\n        session.execute(\n            sa.insert(schema.node).values(\n                node_id=event_node_id, node_type_id=event_type\n            )\n        )\n        session.execute(\n            sa.insert(schema.node_alias).values(\n                node_id=event_node_id,\n                alias_text="한빛 발표회",\n                language="ko",\n                is_preferred=True,\n            )\n        )\n\n    before_batches = _count(case.engine, schema.promotion_batch)\n    before_items = _count(case.engine, schema.knowledge_item)\n    before_alias_evidence = _count(case.engine, schema.node_alias_evidence)\n    before_provenance = _count(case.engine, provenance.promotion_canonical_change)\n\n    def propose(messages: list[tuple[str, str]]) -> object:\n        payload = ResolutionInput.model_validate_json(messages[1][1])\n        if payload.mention_text == "한빛 발표회":\n            assert [item.node_id for item in payload.candidates] == [event_node_id]\n            return {"decision": "SAME", "node_id": event_node_id}\n        return {"decision": "NEW", "node_id": None}\n\n    result = finalize_extraction(\n        case.engine,\n        _runner(case, (case.claims[0],)),\n        case.execution,\n        case.runtime,\n        propose,\n        _claim_new,\n    )\n    assert result.disposition == result.task_status == "FINAL_FAILED"\n    assert _count(case.engine, schema.promotion_batch) == before_batches\n    assert _count(case.engine, schema.knowledge_item) == before_items\n    assert _count(case.engine, schema.event_temporal_extent) == 0\n    assert _count(case.engine, schema.node_alias_evidence) == before_alias_evidence\n    assert (\n        _count(case.engine, provenance.promotion_canonical_change)\n        == before_provenance\n    )\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("existing Event regression anchor changed")
          text = text.replace(anchor, regression + anchor, 1)
          test.write_text(text)

          provenance_migration = Path("server/tests/test_promotion_provenance_migration_postgres.py")
          text = provenance_migration.read_text()
          text = text.replace(
              "def test_clean_upgrade_reaches_0005() -> None:",
              "def test_clean_upgrade_reaches_current_head() -> None:",
              1,
          )
          old = '''        with engine.connect() as connection:\n            assert _version(connection) == "0005"\n            assert _table_exists(connection, "promotion_canonical_change")'''
          new = '''        with engine.connect() as connection:\n            assert _version(connection) == "0006"\n            assert _table_exists(connection, "promotion_canonical_change")'''
          if text.count(old) != 1:
              raise SystemExit("#216 current-head smoke anchor changed")
          provenance_migration.write_text(text.replace(old, new, 1))

          topic_migration = Path("server/tests/test_topic_reference_migration_postgres.py")
          text = topic_migration.read_text()
          old = '''        with engine.connect() as connection:\n            assert _version(connection) == "0005"\n            assert _table_exists(connection, "topic_reference")'''
          new = '''        with engine.connect() as connection:\n            assert _version(connection) == "0006"\n            assert _table_exists(connection, "topic_reference")'''
          if text.count(old) != 1:
              raise SystemExit("Topic current-head smoke anchor changed")
          topic_migration.write_text(text.replace(old, new, 1))
          PY
      - name: Clean staged source
        run: |
          python - <<'PY'
          from pathlib import Path
          promotion = Path("server/src/ontology_map/extraction_promotion.py")
          text = promotion.read_text()
          first = "        claim_created = existing_claim_id is None\n        if existing_claim_id is None:"
          if first not in text:
              raise SystemExit("claim_created cleanup anchor missing")
          text = text.replace(first, "        if existing_claim_id is None:", 1)
          second = "        claim_created = False\n"
          if text.count(second) != 1:
              raise SystemExit(f"unexpected remaining claim_created count: {text.count(second)}")
          promotion.write_text(text.replace(second, "", 1))

          test = Path("server/tests/test_extraction_promotion_postgres.py")
          text = test.read_text()
          old = "from ontology_map.db import extraction_promotion as promotion_db\n"
          if old not in text:
              raise SystemExit("obsolete promotion_db import anchor missing")
          test.write_text(text.replace(old, "", 1))
          PY
      - name: Format and static checks
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen ruff format server/src/ontology_map/extraction_promotion.py server/src/ontology_map/db/extraction_promotion.py server/tests/test_extraction_promotion_postgres.py server/tests/test_promotion_provenance_migration_postgres.py server/tests/test_topic_reference_migration_postgres.py
          uv run --project server --frozen ruff check --fix server/src/ontology_map/extraction_promotion.py server/src/ontology_map/db/extraction_promotion.py server/tests/test_extraction_promotion_postgres.py server/tests/test_promotion_provenance_migration_postgres.py server/tests/test_topic_reference_migration_postgres.py
          uv run --project server --frozen ruff check server
          uv run --project server --frozen ruff format --check server
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map
          (cd server && uv run --frozen mypy src)
          (cd server && uv run --frozen alembic heads) | tee /tmp/alembic-heads.txt
          grep -qx '0006 (head)' /tmp/alembic-heads.txt
      - name: Prepare isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          url="postgresql+psycopg://${POSTGRES_USER}:${password}@127.0.0.1:55433/${POSTGRES_DB}"
          echo "::add-mask::$url"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "ONTOLOGY_MAP_DATABASE_URL=$url"
            echo "ONTOLOGY_MAP_KE_TEST_DATABASE_URL=$url"
          } >> "$GITHUB_ENV"
      - name: Migrate isolated PostgreSQL
        run: |
          docker compose up --wait --wait-timeout 120 db
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'SELECT version(), current_database();'
          (cd server && uv run --frozen alembic upgrade head && uv run --frozen alembic current)
      - name: B3 PostgreSQL regression
        run: uv run --project server --frozen pytest -q -ra server/tests/test_extraction_promotion.py server/tests/test_extraction_promotion_postgres.py
      - name: Migration rehearsal regressions
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T db createdb -U "$POSTGRES_USER" ontology_map_promotion216_test
          docker compose exec -T db createdb -U "$POSTGRES_USER" ontology_map_topic_reference_migration_rehearsal
          base="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:55433"
          ONTOLOGY_MAP_DATABASE_URL="$base/ontology_map_promotion216_test" \
          ONTOLOGY_MAP_PROMOTION_PROVENANCE_MIGRATION_REHEARSAL=1 \
            uv run --project server --frozen pytest -q -ra server/tests/test_promotion_provenance_migration_postgres.py
          ONTOLOGY_MAP_DATABASE_URL="$base/ontology_map_topic_reference_migration_rehearsal" \
          ONTOLOGY_MAP_TOPIC_REFERENCE_MIGRATION_REHEARSAL=1 \
            uv run --project server --frozen pytest -q -ra server/tests/test_topic_reference_migration_postgres.py
      - name: Metadata and migration consistency
        run: |
          (cd server && uv run --frozen alembic check)
          uv run --project server --frozen python scripts/check_docs.py --check
          git diff --check
          ! git grep -n 'DEPENDENCY_BLOCKED_216' -- server/src server/tests
          ! git grep -n 'promotion_db\.commit_batch' -- server/src server/tests
      - name: Commit clean B3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/issue-127-b3-provenance.yml scripts/issue_127_b3_wire_provenance.py
          git add server/src/ontology_map/extraction_promotion.py server/src/ontology_map/db/extraction_promotion.py server/tests/test_extraction_promotion_postgres.py server/tests/test_promotion_provenance_migration_postgres.py server/tests/test_topic_reference_migration_postgres.py
          git diff --cached --check
          git commit -m "feat: wire #127 promotion through #216 provenance"
          git push origin HEAD:feat/127-role-harness
      - name: Cleanup isolated PostgreSQL
        if: ${{ always() }}
        run: docker compose down --volumes
