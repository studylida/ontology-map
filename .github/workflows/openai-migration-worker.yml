name: OpenAI Migration CI Fix Transfer

on:
  push:
    branches: ["feat/240-openai-provider"]
    paths: [".github/workflows/openai-migration-worker.yml"]

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'studylida/ontology-map' && github.ref == 'refs/heads/feat/240-openai-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply only the reviewed lint and response typing fixes
        run: |
          python - <<'PY'
          import pathlib, subprocess
          baseline = 'abc702b6692b9efc173bb2768f76f0a898cc399e'
          workflow = '.github/workflows/openai-migration-worker.yml'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('diff', '--name-only', baseline, 'HEAD').splitlines() == [workflow]
          subprocess.run(['git', 'rm', workflow], check=True)
          assert git('write-tree') == 'b36540e63d07af39ecafc7d590c0b7384aad22a6'
          changes = {
              'server/src/ontology_map/kimi_clients.py': [
                  ('"""OpenAI-only application wiring (legacy module name); construction never sends requests or touches DB.', '"""OpenAI-only application wiring (legacy module name).\n\nConstruction never sends requests or touches the database.')
              ],
              'server/src/ontology_map/node_context_generation.py': [
                  ('\nMODEL_VERSION = role_model("node_context")\nfrom ', '\nfrom '),
                  ('\nPROMPT_VERSION = ', '\nMODEL_VERSION = role_model("node_context")\nPROMPT_VERSION = ')
              ],
              'server/tests/test_extraction.py': [('    ClaimSupport,\n', ''), ('    PLUS,\n', '')],
              'server/tests/test_kimi_transport.py': [('    SCHEMA_SEPARATOR,\n', '')],
              'server/src/ontology_map/llm_response_metadata.py': [
                  ('from typing import Any\n', 'from typing import Any, Protocol\n'),
                  ('def rate_limit_kind(response: httpx.Response) -> str | None:', 'class _JsonResponse(Protocol):\n    """Shared read-only surface of HTTPX and the installed SDK response."""\n\n    @property\n    def status_code(self) -> int: ...\n\n    def json(self) -> Any: ...\n\n\ndef rate_limit_kind(response: _JsonResponse) -> str | None:')
              ],
          }
          for name, pairs in changes.items():
              path = pathlib.Path(name)
              text = path.read_text()
              for old, new in pairs:
                  assert text.count(old) == 1, name
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Pinned checks and ordinary own-branch commit
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen ruff check --select I --fix server/src/ontology_map/node_context_generation.py
          uv run --project server --frozen ruff format server/src/ontology_map/kimi_clients.py server/src/ontology_map/node_context_generation.py server/src/ontology_map/llm_response_metadata.py server/tests/test_extraction.py server/tests/test_kimi_transport.py
          uv run --project server --frozen ruff check server
          uv run --project server --frozen ruff format --check server
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map
          (cd server && uv run --frozen mypy src)
          uv run --project server --frozen python scripts/check_docs.py --check
          git add -- server/src/ontology_map/kimi_clients.py server/src/ontology_map/node_context_generation.py server/src/ontology_map/llm_response_metadata.py server/tests/test_extraction.py server/tests/test_kimi_transport.py
          git diff --cached --check
          git diff --exit-code abc702b6692b9efc173bb2768f76f0a898cc399e -- server/uv.lock server/pyproject.toml
          git config user.name "studylida"
          git config user.email "100192485+studylida@users.noreply.github.com"
          git commit -m "fix: OpenAI 전환의 SDK 응답 타입과 정적 검사 보완"
          git push origin HEAD:refs/heads/feat/240-openai-provider
          git rev-parse HEAD HEAD^{tree}
