name: OpenAI Migration Worker Transfer

on:
  push:
    branches: ["feat/240-openai-provider"]
    paths: [".github/workflows/openai-migration-worker.yml"]

permissions:
  contents: write

jobs:
  transfer:
    if: github.repository == 'studylida/ontology-map' && github.ref == 'refs/heads/feat/240-openai-provider'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      ONTOLOGY_MAP_DATABASE_URL: ""
      PYTHONPATH: ${{ github.workspace }}/server/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply the exact worker patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          baseline = '368ae87301acb4ded3bcdbfc2b029acd1ca27d9b'
          workflow = '.github/workflows/openai-migration-worker.yml'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('diff', '--name-only', baseline, 'HEAD').splitlines() == [workflow]
          subprocess.run(['git', 'rm', workflow], check=True)
          assert git('write-tree') == '3142256b846db4bedaa600f46d602d003618e76a'
          chunks = []
          for sha in ('a48c0173f61345fd7b617388917cd73d46d789d9', 'a81b78dc8d18e99f28678f922bd0c6762f2791ee'):
              req = urllib.request.Request('https://api.github.com/repos/studylida/ontology-map/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              chunk = base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob ' + str(len(chunk)).encode() + b'\0' + chunk).hexdigest() == sha
              chunks.append(chunk)
          packed = b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest() == '27367885f9f7e4ece1d31a1560335bd87996a0f678897ab623151f1a57e1b2e4'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'c0f282d13503c590831a019d850924318dc2650a97f6d13dd155cfc62733859c'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'openai-worker.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          assert git('write-tree') == '54a0bc7f74d41d0e2a33ac88570c86bb5c359ed2'
          changed = git('diff', '--cached', '--name-only', '--diff-filter=AM').splitlines()
          assert all(p.startswith(('server/', 'docs/')) for p in changed)
          assert not {'server/uv.lock', 'server/pyproject.toml'} & set(changed)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'worker-python.json').write_text(json.dumps([p for p in changed if p.endswith('.py')]))
          print('Exact baseline, patch bytes and migration tree verified; no product execution.')
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install only the frozen repository environment
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen python --version
          uv run --project server --frozen ruff --version
          uv run --project server --frozen mypy --version
      - name: Format only changed Python files and publish ordinary commit
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          files = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'worker-python.json').read_text())
          prefix = ['uv', 'run', '--project', 'server', '--frozen', 'ruff']
          subprocess.run(prefix + ['check', '--select', 'I', '--fix', *files], check=True)
          subprocess.run(prefix + ['format', *files], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', '368ae87301acb4ded3bcdbfc2b029acd1ca27d9b', '--', 'server/uv.lock', 'server/pyproject.toml'], check=True)
          assert not pathlib.Path('.github/workflows/openai-migration-worker.yml').exists()
          PY
          git config user.name "studylida"
          git config user.email "100192485+studylida@users.noreply.github.com"
          git commit -m "feat: Luna·Terra 역할별 OpenAI 전환과 합성 검증"
          git push origin HEAD:refs/heads/feat/240-openai-provider
          git rev-parse HEAD HEAD^{tree}
          git archive --format=tar.gz --output="$RUNNER_TEMP/openai-worker-source.tar.gz" HEAD
      - name: Full Ruff checks without relaxed rules
        id: ruff
        continue-on-error: true
        run: |
          uv run --project server --frozen ruff check server
          uv run --project server --frozen ruff format --check server
      - name: Both pinned mypy invocations
        id: mypy
        continue-on-error: true
        run: |
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map
          (cd server && uv run --frozen mypy src)
      - name: Synthetic backend tests only; no DB or provider credentials
        id: tests
        continue-on-error: true
        run: uv run --project server --frozen pytest -q -ra server/tests --junitxml="$RUNNER_TEMP/openai-worker-tests.xml"
      - name: Documentation consistency
        id: docs
        continue-on-error: true
        run: uv run --project server --frozen python scripts/check_docs.py --check
      - name: Safe source and synthetic verification artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openai-worker-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/openai-worker-source.tar.gz
            ${{ runner.temp }}/openai-worker-tests.xml
          if-no-files-found: warn
      - name: Preserve real failure status
        if: always()
        env:
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          DOC_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          test "$RUFF_OUTCOME" = success
          test "$MYPY_OUTCOME" = success
          test "$TEST_OUTCOME" = success
          test "$DOC_OUTCOME" = success
