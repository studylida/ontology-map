name: Issue 216 Stage One Patch Runner

on:
  push:
    branches:
      - issue-216-promotion-provenance
    paths:
      - ".github/workflows/issue-216-stage1-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-216-promotion-provenance
          persist-credentials: true
      - name: Extract and apply the stored patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue-216-stage1-scope-patch.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.rindex("\n          PY\n")
          raw = source[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          Path('/tmp/issue216_stage1.py').write_text(code + '\n', encoding='utf-8')
          compile(code, '/tmp/issue216_stage1.py', 'exec')
          PY
          python /tmp/issue216_stage1.py
      - name: Prepare uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - name: Format, clean temporary workflows, and commit
        run: |
          uvx ruff@0.16.5 format \
            server/tests/test_promotion_provenance_postgres.py \
            server/tests/test_promotion_provenance_migration_postgres.py
          git rm \
            .github/workflows/issue-216-stage1-scope-patch.yml \
            .github/workflows/issue-216-stage1-fix.yml
          git diff --check
          git add \
            docs/data/logical-schema.md \
            docs/data/physical-schema.md \
            docs/data/promotion-canonical-provenance.md \
            server/tests/test_promotion_provenance_postgres.py \
            server/tests/test_promotion_provenance_migration_postgres.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: focus issue 216 stage-one persistence checkpoint"
          git push origin HEAD:issue-216-promotion-provenance
