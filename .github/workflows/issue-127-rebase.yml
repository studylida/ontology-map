name: Issue 127 Rebase

on:
  push:
    branches: ["feat/127-role-harness"]
    paths:
      - ".github/workflows/issue-127-rebase.yml"

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/127-role-harness
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase onto latest main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/issue-127-rebase.yml
          git commit -m "chore: remove temporary issue 127 rebase workflow"
          git push --force-with-lease origin HEAD:feat/127-role-harness
