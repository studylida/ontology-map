name: Issue 201 Reviewer Fix Temp

on:
  push:
    branches:
      - issue-201-approved-ontology-reference-data
    paths:
      - scripts/issue201_reviewer_fix_temp.py
      - .github/workflows/issue201-reviewer-fix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-201-approved-ontology-reference-data
          fetch-depth: 2
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.12.7'
      - name: Apply reviewer fix
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen python scripts/issue201_reviewer_fix_temp.py
          rm scripts/issue201_reviewer_fix_temp.py
          rm .github/workflows/issue201-reviewer-fix-temp.yml
          uv run --project server --frozen ruff format --check server
          uv run --project server --frozen ruff check server
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map
          git diff --check
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve #201 activation boundaries'
          git push origin HEAD:issue-201-approved-ontology-reference-data
