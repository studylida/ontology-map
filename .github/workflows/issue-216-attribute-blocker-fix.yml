name: Issue 216 Attribute Blocker Fix

on:
  push:
    branches:
      - issue-216-promotion-provenance
    paths:
      - ".github/workflows/issue-216-attribute-blocker-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-216-promotion-provenance
          fetch-depth: 2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
      - name: Remove unapproved attribute-value semantic dedupe
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              start_pos = text.index(start)
              end_pos = text.index(end, start_pos)
              file.write_text(text[:start_pos] + replacement + text[end_pos:], encoding="utf-8")

          provenance_path = "server/src/ontology_map/db/promotion_provenance.py"
          new_attribute = '''def add_claim_attribute_value(
              session: Session,
              batch_id: int,
              *,
              claim_id: int,
              target_node_id: int,
              attribute_revision_id: int,
              value_kind: str,
              string_value: str | None = None,
              number_value: Decimal | int | None = None,
              unit_code: str | None = None,
              date_from: date | None = None,
              date_to: date | None = None,
              date_from_precision: str = "UNKNOWN",
              date_to_precision: str = "UNKNOWN",
              boolean_value: bool | None = None,
          ) -> int:
              """Insert one canonical attribute-value row and record its exact row provenance.

              This #216 boundary deliberately does not define semantic equality or reuse
              between separate claim_attribute_value rows. Reprocess/canonicalization
              decisions belong to their owning caller before this mutation is requested.
              """
              require_pending_batch(session, batch_id)
              values = {
                  "claim_id": claim_id,
                  "target_node_id": target_node_id,
                  "attribute_revision_id": attribute_revision_id,
                  "value_kind": value_kind,
                  "string_value": string_value,
                  "number_value": number_value,
                  "unit_code": unit_code,
                  "date_from": date_from,
                  "date_to": date_to,
                  "date_from_precision": date_from_precision,
                  "date_to_precision": date_to_precision,
                  "boolean_value": boolean_value,
              }
              value_id = int(
                  session.execute(
                      sa.text("""
                          INSERT INTO claim_attribute_value (
                              claim_id, target_node_id, attribute_revision_id, value_kind,
                              string_value, number_value, unit_code, date_from, date_to,
                              date_from_precision, date_to_precision, boolean_value
                          ) VALUES (
                              :claim_id, :target_node_id, :attribute_revision_id, :value_kind,
                              :string_value, :number_value, :unit_code, :date_from, :date_to,
                              :date_from_precision, :date_to_precision, :boolean_value
                          )
                          RETURNING claim_attribute_value_id
                      """),
                      values,
                  ).scalar_one()
              )
              _record_change(
                  session,
                  batch_id,
                  "CLAIM_ATTRIBUTE_VALUE_ADDED",
                  claim_attribute_value_id=value_id,
              )
              return value_id


          '''
          replace_between(
              provenance_path,
              "def add_claim_attribute_value(\n",
              "def add_event_temporal_basis(\n",
              new_attribute,
          )

          test_path = "server/tests/test_promotion_provenance_postgres.py"
          new_test = '''def test_claim_associations_are_idempotent_and_attribute_uses_exact_row_target(
              database: Session,
          ) -> None:
              values = _base_objects(database)
              batch_id = _batch(database)

              assert provenance.add_claim_observation(
                  database, batch_id, values["claim"], values["observation"]
              )
              assert not provenance.add_claim_observation(
                  database, batch_id, values["claim"], values["observation"]
              )

              new_observation = _observation(database)
              assert provenance.add_claim_observation(
                  database, batch_id, values["claim"], new_observation
              )

              assert provenance.add_claim_relation(
                  database, batch_id, values["claim"], values["relation"], "SUPPORT"
              )
              assert not provenance.add_claim_relation(
                  database, batch_id, values["claim"], values["relation"], "SUPPORT"
              )
              with pytest.raises(ValueError, match="no approved #216 change kind"):
                  provenance.add_claim_relation(
                      database, batch_id, values["claim"], values["relation"], "DISPUTE"
                  )

              attribute_value_id = provenance.add_claim_attribute_value(
                  database,
                  batch_id,
                  claim_id=values["claim"],
                  target_node_id=values["left"],
                  attribute_revision_id=values["attribute_revision"],
                  value_kind="STRING",
                  string_value="issue 216 value",
              )

              assert provenance.add_event_temporal_basis(
                  database, batch_id, values["event"], values["claim"]
              )
              assert not provenance.add_event_temporal_basis(
                  database, batch_id, values["event"], values["claim"]
              )

              changes = provenance.changes_for_batch(database, batch_id)
              assert [change.change_kind for change in changes] == [
                  "CLAIM_OBSERVATION_ADDED",
                  "CLAIM_OBSERVATION_ADDED",
                  "CLAIM_RELATION_ADDED",
                  "CLAIM_ATTRIBUTE_VALUE_ADDED",
                  "EVENT_TEMPORAL_BASIS_ADDED",
              ]
              attribute_change = next(
                  change
                  for change in changes
                  if change.change_kind == "CLAIM_ATTRIBUTE_VALUE_ADDED"
              )
              assert attribute_change.claim_attribute_value_id == attribute_value_id
              assert attribute_change.claim_id is None
              assert attribute_change.event_node_id is None


          '''
          replace_between(
              test_path,
              "def test_claim_association_attribute_and_event_surfaces_are_exact_and_idempotent(\n",
              "def test_canonical_mutation_and_provenance_roll_back_together(\n",
              new_test,
          )

          docs_path = Path("docs/data/physical-schema.md")
          docs = docs_path.read_text(encoding="utf-8")
          old = (
              "migration `0005`는 historical association을 backfill하지 않는다. "
              "`ontology_map.db.promotion_provenance`의 production write boundary는 caller가 연 promotion transaction 안에서만 동작하고 association insert는 `INSERT ... ON CONFLICT DO NOTHING RETURNING ...` 결과로 실제 mutation 여부를 판별한다. "
              "`claim_attribute_value` exact retry는 owning Claim row를 잠근 뒤 exact stored tuple을 재조회해 기존 행을 재사용한다. "
              "merged #128 Entity Resolution의 alias/alias-evidence path는 이 boundary에 직접 연결되어 실제 INSERT winner만 provenance를 남긴다. "
              "Claim/Relation/attribute/event canonical service도 같은 transaction-local boundary를 제공하며, 최종 KNOWLEDGE_EXTRACTION orchestration은 별도 #127 책임이다. "
              "`mark_promotion_committed`는 canonical writes와 provenance 뒤 같은 caller transaction에서 `COMMITTED`를 확정하지만 commit 자체는 호출하지 않는다. #215 initial publication coordinator와 #180 recovery는 별도 책임으로 남는다."
          )
          new = (
              "migration `0005`는 historical association을 backfill하지 않는다. "
              "`ontology_map.db.promotion_provenance`의 production write boundary는 caller가 연 promotion transaction 안에서만 동작하고 association insert는 `INSERT ... ON CONFLICT DO NOTHING RETURNING ...` 결과로 실제 mutation 여부를 판별한다. "
              "`claim_attribute_value`에는 #216이 새로운 semantic equality나 UNIQUE 규칙을 추가하지 않는다. caller가 canonical insert를 요청하면 `add_claim_attribute_value()`는 새 row를 INSERT하고 반환된 exact `claim_attribute_value_id`에 provenance를 기록하며, 동일 입력의 재처리 억제나 canonical reuse 여부는 #125 task/cache와 #127 canonicalization/write path가 소유한다. "
              "merged #128 Entity Resolution의 alias/alias-evidence path는 이 boundary에 직접 연결되어 실제 INSERT winner만 provenance를 남긴다. "
              "Claim/Relation/attribute/event canonical service도 같은 transaction-local boundary를 제공하며, 최종 KNOWLEDGE_EXTRACTION orchestration은 별도 #127 책임이다. "
              "`mark_promotion_committed`는 canonical writes와 provenance 뒤 같은 caller transaction에서 `COMMITTED`를 확정하지만 commit 자체는 호출하지 않는다. #215 initial publication coordinator와 #180 recovery는 별도 책임으로 남는다."
          )
          if docs.count(old) != 1:
              raise SystemExit("physical-schema exact-tuple reuse paragraph anchor changed")
          docs_path.write_text(docs.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Format and focused static checks
        run: |
          uv sync --project server --frozen
          uv run --project server --frozen ruff format server/src/ontology_map/db/promotion_provenance.py server/tests/test_promotion_provenance_postgres.py
          uv run --project server --frozen ruff check server/src/ontology_map/db/promotion_provenance.py server/tests/test_promotion_provenance_postgres.py
          uv run --project server --frozen mypy --config-file server/pyproject.toml server/src/ontology_map/db/promotion_provenance.py
          git diff --check
      - name: Commit blocker fix and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-216-attribute-blocker-fix.yml
          git add server/src/ontology_map/db/promotion_provenance.py server/tests/test_promotion_provenance_postgres.py docs/data/physical-schema.md
          git commit -m 'fix: keep attribute provenance on physical row identity'
          git push origin HEAD:issue-216-promotion-provenance
