services:
  db:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ontology-map-postgres:/var/lib/postgresql

  api:
    build: ./server
    environment:
      ONTOLOGY_MAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ONTOLOGY_MAP_ENVIRONMENT: ${ONTOLOGY_MAP_ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  ontology-map-postgres:
